name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-core:
    name: "Build scala core module"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build core module
        # Override logos-cpp-sdk to get lidl-frontend/impl_header_parser.cpp
        # (missing in pinned 95f763b, added in d12a7bb)
        run: nix build -L . --override-input logos-cpp-sdk github:logos-co/logos-cpp-sdk

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: scala-plugin
          path: result/

  build-ui:
    name: "Build scala-ui module"
    runs-on: ubuntu-latest
    needs: build-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build UI module
        run: cd scala-ui && nix build -L . --override-input logos-cpp-sdk github:logos-co/logos-cpp-sdk

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: scala-ui-plugin
          path: result/

  flake-check:
    name: "Flake metadata check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Check flake metadata (core)
        run: nix flake metadata --no-update-lock-file

      - name: Check flake metadata (UI)
        run: cd scala-ui && nix flake metadata --no-update-lock-file
