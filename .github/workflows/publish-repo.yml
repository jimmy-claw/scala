name: Publish Module Repository
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no upload/commit)"
        type: boolean
        default: false

jobs:
  # Build .lgx packages (reuses proven CI logic)
  build-lgx-core:
    name: "Build core .lgx"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Build .lgx
        run: nix build -L --override-input logos-module-builder github:logos-co/logos-module-builder .#lgx-portable
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: core-lgx
          path: result/

  build-lgx-ui:
    name: "Build UI .lgx"
    runs-on: ubuntu-latest
    needs: build-lgx-core
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Build .lgx
        run: cd scala-ui && nix build -L --override-input logos-module-builder github:logos-co/logos-module-builder --override-input scala path:.. .#lgx-portable
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ui-lgx
          path: scala-ui/result/

  # Sign + publish
  publish-repo:
    name: "Sign + Publish"
    runs-on: ubuntu-latest
    needs: [build-lgx-core, build-lgx-ui]
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: build-output/

      - name: List artifacts
        run: find build-output/ -type f | head -30

      - name: Install Python dependencies
        run: pip3 install cryptography --break-system-packages || pip3 install cryptography

      - name: Copy signing key
        run: |
          echo "${{ secrets.SCALA_REPO_SIGNING_KEY }}" > $HOME/.scala-repo-signing-key.pem
          chmod 600 $HOME/.scala-repo-signing-key.pem

      - name: Run publish script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRY_FLAG=${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          bash scripts/publish-repo.sh $DRY_FLAG

      - name: Push updated index
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "jimmy-claw"
          git config user.email "jimmy-claw@users.noreply.github.com"
          git push origin main
