name: Publish Module Repository
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no upload/commit)"
        type: boolean
        default: false

jobs:
  publish-repo:
    name: "Build + Sign + Publish"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build core module .lgx
        run: nix build --extra-experimental-features 'flakes nix-command' --override-input logos-module-builder github:logos-co/logos-module-builder .#lgx-portable

      - name: Build UI module .lgx
        run: |
          cd scala-ui
          nix build --extra-experimental-features 'flakes nix-command' \
            --override-input logos-module-builder github:logos-co/logos-module-builder \
            --override-input scala path:.. \
            .#lgx-portable

      - name: Collect artifacts
        run: |
          mkdir -p build-output
          # Copy from core result
          if [[ -L result ]]; then
            find result -name '*.lgx' -exec cp {} build-output/ \;
          fi
          # Copy from UI result
          cd scala-ui
          if [[ -L result ]]; then
            find result -name '*.lgx' -exec cp {} ../build-output/ \;
          fi
          cd ..
          echo "=== Collected ==="
          ls -la build-output/

      - name: Install Python dependencies
        run: pip3 install cryptography --break-system-packages || pip3 install cryptography

      - name: Copy signing key
        run: |
          echo "${{ secrets.SCALA_REPO_SIGNING_KEY }}" > $HOME/.scala-repo-signing-key.pem
          chmod 600 $HOME/.scala-repo-signing-key.pem

      - name: Run publish script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRY_FLAG=${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          bash scripts/publish-repo.sh $DRY_FLAG

      - name: Push updated index
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "jimmy-claw"
          git config user.email "jimmy-claw@users.noreply.github.com"
          git push origin main
